version: '3.9'

services:
  db:
    image: postgres:15
    container_name: kard_db
    environment:
      POSTGRES_DB: kard_db
      POSTGRES_USER: kard_user
      POSTGRES_PASSWORD: kard_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kard_user"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: kard_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: .
    container_name: kard_backend
    ports:
      - "8000:8000"
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://kard_user:kard_password@db:5432/kard_db
      REDIS_URL: redis://redis:6379/0

volumes:
  postgres_data:
